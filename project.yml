name: Pensieve
options:
  bundleIdPrefix: me.mazetti
  developmentLanguage: en
  knownRegions:
    - en
    - de
  deploymentTarget:
    macOS: "15.0"
packages:
  PensieveKit:
    path: .
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  sqlite-data:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.6.0"
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.12.1"
targets:
  Pensieve:
    type: application
    platform: macOS
    sources:
      - Sources/PensieveApp
      - icons/Pensieve.icon
      - path: SyncAgent/me.mazetti.pensieve.sync.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PensieveKit
        product: PensieveKit
      - package: MarkdownUI
        product: MarkdownUI
      - sdk: MetricKit.framework
      - target: PensieveSyncAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: pensieve
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Sources/PensieveApp/Info.plist
      properties:
        CFBundleName: Pensieve
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        CFBundleIconName: Pensieve
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleURLTypes:
          - CFBundleURLName: me.mazetti.pensieve
            CFBundleURLSchemes:
              - pensieve
        CFBundleLocalizations:
          - en
          - de
    settings:
      base:
        PRODUCT_NAME: Pensieve
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve
        ASSETCATALOG_COMPILER_APPICON_NAME: Pensieve
        MARKETING_VERSION: "0.2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        # OFF on purpose: with a hand-authored String Catalog, compiler string extraction rewrites
        # the *source* Localizable.xcstrings on every build (reorders keys, resets German states).
        # The catalog is still compiled into the app regardless; keys are reconciled by hand.
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # Match PensieveKit's Swift 6 language mode so the app target gets the same strict-concurrency
        # checking as `swift test` — otherwise concurrency bugs slip through the Xcode build.
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets: []
      # Disabled by default → a Build+Run uses the LIVE stores at
      # ~/Library/Application Support/Pensieve/. Tick these on in
      # Edit Scheme ▸ Run ▸ Arguments to sandbox against a throwaway
      # empty store (auto-created on open) instead.
      environmentVariables:
        - variable: PENSIEVE_DB
          value: "/Users/moritz/Library/Application Support/Pensieve-Dev/pensieve.sqlite"
          isEnabled: false
        - variable: PENSIEVE_CAPTURE_DB
          value: "/Users/moritz/Library/Application Support/Pensieve-Dev/capture.sqlite"
          isEnabled: false
  PensieveSyncAgent:
    type: tool
    platform: macOS
    sources:
      - Sources/PensieveSyncAgent
    dependencies:
      - package: PensieveKit
        product: PensieveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.sync
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        SWIFT_VERSION: "6.0"
  pensieve:
    type: tool
    platform: macOS
    sources:
      - Sources/pensieve
    dependencies:
      - package: PensieveKit
        product: PensieveKit
      - package: sqlite-data
        product: SQLiteData
      - package: swift-argument-parser
        product: ArgumentParser
      - package: swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        SWIFT_VERSION: "6.0"
    scheme: {}
