name: Pensieve
options:
  bundleIdPrefix: me.mazetti
  deploymentTarget:
    macOS: "15.0"
packages:
  PensieveKit:
    path: .
targets:
  Pensieve:
    type: application
    platform: macOS
    sources:
      - Sources/PensieveApp
      - icons/Pensieve.icon
    dependencies:
      - package: PensieveKit
        product: PensieveKit
    info:
      path: Sources/PensieveApp/Info.plist
      properties:
        CFBundleName: Pensieve
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        CFBundleIconName: Pensieve
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleURLTypes:
          - CFBundleURLName: me.mazetti.pensieve
            CFBundleURLSchemes:
              - pensieve
    settings:
      base:
        PRODUCT_NAME: Pensieve
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve
        ASSETCATALOG_COMPILER_APPICON_NAME: Pensieve
        MARKETING_VERSION: "0.2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
