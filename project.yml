name: Pensieve
options:
  bundleIdPrefix: me.mazetti
  developmentLanguage: en
  knownRegions:
    - en
    - de
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    # XcodeGen's project-level default is 5.0; every target already overrides it to 6.0, but a
    # target added without that override would silently compile in Swift 5 mode. Set the default.
    SWIFT_VERSION: "6.0"
    # Paid individual membership (activated 2026-08-21). Set once here so the four targets that
    # sign cannot drift onto different teams — a nested helper on another team fails validation.
    DEVELOPMENT_TEAM: TH593VRB6W
    # An app extension's CFBundleShortVersionString must match its containing app's exactly, so
    # both read one value from here rather than each target carrying its own copy to drift apart.
    MARKETING_VERSION: "0.2"
packages:
  PensieveKit:
    path: .
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  sqlite-data:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.6.0"
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.12.1"
targets:
  Pensieve:
    type: application
    platform: macOS
    sources:
      - Sources/PensieveApp
      - icons/Pensieve.icon
      - path: SyncAgent/me.mazetti.pensieve.sync.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PensieveKit
        product: PensieveKit
      - package: MarkdownUI
        product: MarkdownUI
      - sdk: MetricKit.framework
      - target: PensieveSyncAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: PensieveCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PensieveWidget
        embed: true
        codeSign: true
        copy:
          destination: plugins
    info:
      path: Sources/PensieveApp/Info.plist
      properties:
        CFBundleName: Pensieve
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        CFBundleIconName: Pensieve
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleURLTypes:
          - CFBundleURLName: me.mazetti.pensieve
            CFBundleURLSchemes:
              - pensieve
        CFBundleLocalizations:
          - en
          - de
    settings:
      base:
        PRODUCT_NAME: Pensieve
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve
        ASSETCATALOG_COMPILER_APPICON_NAME: Pensieve
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        # The app is the only target that needs an entitlement: it owns the App Group container a
        # sandboxed widget will later read. The CLI and the sync agent are not sandboxed, so they
        # reach the same directory by path and need no entitlement of their own.
        CODE_SIGN_ENTITLEMENTS: Pensieve.entitlements
        # OFF on purpose: with a hand-authored String Catalog, compiler string extraction rewrites
        # the *source* Localizable.xcstrings on every build (reorders keys, resets German states).
        # The catalog is still compiled into the app regardless; keys are reconciled by hand.
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # OFF for the same reason as the line above, and it is not optional here: XcodeGen's setting
        # presets turn STRING_CATALOG_GENERATE_SYMBOLS on, and generated symbols cannot coexist with
        # this hand-authored catalog. The keys ARE the UI strings, so several differ only by case or
        # trailing punctuation — "Archive"/"archive", "Delete"/"Delete…", "New Child"/"New Child…",
        # "LLM Provider"/"LLM provider", "None open"/"None open." — and each such pair derives the
        # same Swift symbol, which is a hard build error (25 of them). Deduplicating is NOT the fix:
        # a key must match its Swift literal character-for-character or German silently falls back to
        # English. Nothing reads the generated symbols (the app uses plain `Text("…")` literals), so
        # generation buys nothing and costs a broken build. The failure is intermittent because the
        # step only runs when the derived symbol file is stale, so a cached build hides it.
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
        # Match PensieveKit's Swift 6 language mode so the app target gets the same strict-concurrency
        # checking as `swift test` — otherwise concurrency bugs slip through the Xcode build.
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - PensieveUITests
      # Disabled by default → a Build+Run uses the LIVE stores at
      # ~/Library/Application Support/Pensieve/. Tick these on in
      # Edit Scheme ▸ Run ▸ Arguments to sandbox against a throwaway
      # empty store (auto-created on open) instead.
      environmentVariables:
        - variable: PENSIEVE_DB
          value: "/Users/moritz/Library/Application Support/Pensieve-Dev/pensieve.sqlite"
          isEnabled: false
        - variable: PENSIEVE_CAPTURE_DB
          value: "/Users/moritz/Library/Application Support/Pensieve-Dev/capture.sqlite"
          isEnabled: false
  PensieveUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PensieveUITests
    dependencies:
      - target: Pensieve
      - package: PensieveKit
        product: PensieveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.uitests
        # Required: without it xcodebuild refuses to code sign the test bundle.
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Pensieve

  PensieveSyncAgent:
    type: tool
    platform: macOS
    sources:
      - Sources/PensieveSyncAgent
    dependencies:
      - package: PensieveKit
        product: PensieveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.sync
        # A `tool` target has no Info.plist, so `codesign` names the binary after the FILE
        # (Identifier=PensieveSyncAgent) and `otool -s __TEXT __info_plist` finds nothing —
        # PRODUCT_BUNDLE_IDENTIFIER above does NOT reach the binary on its own. Every working
        # third-party background agent on this machine is a nested `.app` with a real bundle
        # identity, so give this one the equivalent: an Info.plist section carrying
        # CFBundleIdentifier, embedded in the Mach-O.
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        SWIFT_VERSION: "6.0"
  PensieveCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/pensieve
    dependencies:
      - package: PensieveKit
        product: PensieveKit
      - package: sqlite-data
        product: SQLiteData
      - package: swift-argument-parser
        product: ArgumentParser
      - package: swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_NAME: pensieve
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.cli
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        SWIFT_VERSION: "6.0"
    scheme: {}
  PensieveWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/PensieveWidget
    dependencies:
      - package: PensieveKit
        product: PensieveKit
    info:
      path: Sources/PensieveWidget/Info.plist
      properties:
        CFBundleName: PensieveWidget
        CFBundleDisplayName: Pensieve
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Without this the German catalog is compiled but never selected.
        CFBundleLocalizations:
          - en
          - de
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: PensieveWidget
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.pensieve.widget
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGN_ENTITLEMENTS: PensieveWidget.entitlements
        # Same reason as the app target: with a hand-authored String Catalog, compiler string
        # extraction rewrites the *source* Localizable.xcstrings on every build (reorders keys,
        # resets German states). The catalog is still compiled into the extension regardless; keys
        # are reconciled by hand.
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # Same reason as the app target: XcodeGen's presets turn this on, and generated symbols
        # cannot coexist with a hand-authored catalog whose keys differ only by case/punctuation.
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
